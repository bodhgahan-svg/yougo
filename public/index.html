<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUGO - Watch Shorts & Earn</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #000; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }
    
    header { width: 100%; max-width: 480px; background: rgba(0,0,0,0.8); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: fixed; top: 0; z-index: 20; }
    .logo { color: #ff0050; font-size: 22px; font-weight: bold; }
    .coin-badge { background: #ffe600; color: #000; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; }

    .container { width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .card { background: #1f1f1f; padding: 25px; border-radius: 12px; width: 90%; }

    input { width: 100%; padding: 12px; margin: 8px 0 16px; background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #fff; }
    button { width: 100%; padding: 14px; background: #ff0050; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
    .toggle-link { color: #aaa; text-align: center; margin-top: 12px; font-size: 14px; cursor: pointer; text-decoration: underline; }

    /* Vertical Reels Container */
    .reels-container { width: 100%; max-width: 480px; height: 100vh; position: relative; padding-top: 60px; padding-bottom: 70px; display: flex; flex-direction: column; align-items: center; }
    iframe { width: 100%; height: 75vh; border-radius: 12px; border: none; }
    
    .bottom-bar { position: fixed; bottom: 10px; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 8px; z-index: 20; padding: 0 10px; }
    .timer-text { color: #00ff66; font-size: 14px; text-align: center; font-weight: bold; background: rgba(0,0,0,0.7); padding: 5px; border-radius: 6px; }
    
    .hidden { display: none; }
    .msg { margin-top: 10px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <div class="logo">YOUGO</div>
    <div id="coinBadge" class="coin-badge hidden">🪙 <span id="userCoins">0</span></div>
  </header>

  <div class="container" id="authContainer">
    <div id="authSection" class="card">
      <h2 id="authTitle" style="margin-bottom: 15px; text-align: center;">लॉगिन करें</h2>
      <input type="email" id="email" placeholder="ईमेल (Email)" />
      <input type="password" id="password" placeholder="पासवर्ड (Password)" />
      <button id="authBtn" onclick="handleAuth()">लॉगिन (Login)</button>
      <div class="toggle-link" onclick="toggleAuthMode()" id="toggleBtn">अकाउंट नहीं है? साइन अप करें</div>
      <div id="authMsg" class="msg"></div>
    </div>
  </div>

  <!-- Shorts / Reels Feed -->
  <div id="dashboardSection" class="reels-container hidden">
    <!-- Dynamic YouTube Shorts Player -->
    <iframe id="videoPlayer" src="https://www.youtube.com/embed/tgbNymZ7vqY?autoplay=1&mute=0" allow="autoplay" allowfullscreen></iframe>
    
    <div class="bottom-bar">
      <div id="timerText" class="timer-text">शॉर्ट्स देखें: 15 सेकंड...</div>
      <button id="claimBtn" onclick="claimReward()" disabled>पुरस्कार लें (+10 Coins)</button>
      <button onclick="nextVideo()" style="background: #333; margin-top: 5px;">अगला वीडियो ⏭️</button>
    </div>
  </div>

  <script>
    let isLogin = true;
    let coins = 0;
    let watchTimer = null;
    let secondsWatched = 0;
    let currentUserId = null;

    // ट्रेडिंग / वायरल YouTube Shorts URLs की लिस्ट
    const shortVideos = [
      "https://www.youtube.com/embed/tgbNymZ7vqY?autoplay=1",
      "https://www.youtube.com/embed/L_LUpnjgPso?autoplay=1",
      "https://www.youtube.com/embed/3JZ_D3ELwOQ?autoplay=1"
    ];
    let currentVideoIndex = 0;

    function toggleAuthMode() {
      isLogin = !isLogin;
      document.getElementById('authTitle').innerText = isLogin ? 'लॉगिन करें' : 'साइन अप करें';
      document.getElementById('authBtn').innerText = isLogin ? 'लॉगिन (Login)' : 'साइन अप करें (Sign Up)';
      document.getElementById('toggleBtn').innerText = isLogin ? 'अकाउंट नहीं है? साइन अप करें' : 'पहले से अकाउंट है? लॉगिन करें';
    }

    async function handleAuth() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('authMsg');
      const endpoint = isLogin ? '/api/login' : '/api/auth/signup';

      msg.innerText = 'कृपया प्रतीक्षा करें...';
      msg.style.color = '#ccc';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          msg.style.color = '#00ff66';
          if (isLogin) {
            currentUserId = data.user.id;
            showDashboard();
          } else {
            msg.innerText = 'अकाउंट बन गया! अब लॉगिन करें।';
            toggleAuthMode();
          }
        } else {
          msg.style.color = '#ff4444';
          msg.innerText = data.error || 'कुछ गड़बड़ हुई';
        }
      } catch (err) {
        msg.style.color = '#ff4444';
        msg.innerText = 'सर्वर कनेक्शन एरर';
      }
    }

    function showDashboard() {
      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('coinBadge').classList.remove('hidden');
      startVideoTracking();
    }

    function startVideoTracking() {
      secondsWatched = 0;
      document.getElementById('claimBtn').disabled = true;
      
      clearInterval(watchTimer);
      watchTimer = setInterval(() => {
        secondsWatched++;
        document.getElementById('timerText').innerText = `प्रतीक्षा करें: ${15 - secondsWatched} सेकंड`;
        if (secondsWatched >= 15) {
          clearInterval(watchTimer);
          document.getElementById('timerText').innerText = '🎉 +10 कॉइन्स क्लेम करें!';
          document.getElementById('claimBtn').disabled = false;
        }
      }, 1000);
    }

    async function claimReward() {
      try {
        // Backend DB में कॉइन्स सेव करें
        const res = await fetch('/api/user/add-coins', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUserId, coinsToAdd: 10 })
        });
        const data = await res.json();

        if (res.ok) {
          coins = data.totalCoins;
          document.getElementById('userCoins').innerText = coins;
          alert('10 Coins Supabase डेटाबेस में सुरक्षित सेव हो गए!');
          nextVideo();
        }
      } catch (err) {
        alert('Coins Save नहीं हो पाए, कनेक्शन चेक करें।');
      }
    }

    function nextVideo() {
      currentVideoIndex = (currentVideoIndex + 1) % shortVideos.length;
      document.getElementById('videoPlayer').src = shortVideos[currentVideoIndex];
      startVideoTracking();
    }
  </script>
</body>
</html>
