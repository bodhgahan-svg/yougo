<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YOUGO - Instagram Watch-to-Earn</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; touch-action: manipulation; }

    /* Top Floating Header & Earnings */
    header { 
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100; 
      padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; 
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%); 
    }
    .logo { color: #fff; font-size: 20px; font-weight: 900; letter-spacing: 1px; }
    .wallet-box { 
      background: rgba(255, 215, 0, 0.2); border: 1px solid #ffd700; 
      padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; color: #ffd700; 
    }

    /* Instagram Reel Viewport */
    .reels-viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; background: #000; }
    .reel-frame { width: 100%; height: 100%; border: none; }

    /* Right Action Bar */
    .right-actions {
      position: fixed; right: 15px; bottom: 80px; z-index: 90;
      display: flex; flex-direction: column; gap: 20px; align-items: center;
    }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .action-icon { 
      width: 45px; height: 45px; background: rgba(255,255,255,0.15); 
      border-radius: 50%; display: flex; justify-content: center; align-items: center; 
      font-size: 20px; backdrop-filter: blur(8deg); 
    }
    .action-text { font-size: 12px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

    /* Bottom Information */
    .bottom-info {
      position: fixed; bottom: 20px; left: 15px; width: 75%; z-index: 90;
      display: flex; flex-direction: column; gap: 6px; text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      pointer-events: none;
    }
    .username { font-weight: bold; font-size: 15px; }
    .caption { font-size: 13px; opacity: 0.9; }

    /* Reward Popups */
    .reward-popup {
      position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(135deg, #ffd700, #ff8c00); padding: 10px 20px;
      border-radius: 25px; font-weight: 900; font-size: 16px; color: #000;
      z-index: 150; box-shadow: 0 10px 25px rgba(0,0,0,0.5); pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27);
    }
    .reward-popup.show { transform: translate(-50%, -50%) scale(1.1); }
  </style>
</head>
<body>

  <header>
    <div class="logo">YOUGO</div>
    <div class="wallet-box" id="userBalance">🪙 0 Coins (₹0.00)</div>
  </header>

  <div class="reels-viewport">
    <iframe id="reelEmbed" class="reel-frame" allowfullscreen></iframe>

    <!-- Right Actions -->
    <div class="right-actions">
      <div class="action-btn" onclick="toggleLike(this)">
        <div class="action-icon">❤️</div>
        <div class="action-text">Like</div>
      </div>
      <div class="action-btn" onclick="nextReel()">
        <div class="action-icon">⏭️</div>
        <div class="action-text">Next</div>
      </div>
      <div class="action-btn" onclick="shareReel()">
        <div class="action-icon">✈️</div>
        <div class="action-text">Share</div>
      </div>
    </div>

    <!-- Bottom Caption -->
    <div class="bottom-info">
      <div class="username">@trending_reels</div>
      <div class="caption">Watch & Earn with YOUGO! 🚀 #reels #earn</div>
    </div>
  </div>

  <div id="rewardPopup" class="reward-popup">+10 Coins Earned! 💰</div>

  <script>
    // Public Instagram Reel Links Array
    const instagramReels = [
      "https://www.instagram.com/reel/C3_xM_LRI0R/embed",
      "https://www.instagram.com/p/C2_xM_LRI0R/embed"
    ];
    
    let currentIndex = 0;
    let coins = 0;

    // Load Reel Function
    function loadReel(index) {
      currentIndex = index % instagramReels.length;
      document.getElementById('reelEmbed').src = instagramReels[currentIndex];
      
      // Reward logic trigger
      giveReward();
    }

    function nextReel() {
      currentIndex++;
      loadReel(currentIndex);
    }

    function toggleLike(btn) {
      const icon = btn.querySelector('.action-icon');
      icon.innerText = icon.innerText === "❤️" ? "💖" : "❤️";
    }

    function shareReel() {
      if (navigator.share) {
        navigator.share({ title: 'YOUGO Reel', url: window.location.href });
      }
    }

    function giveReward() {
      // Add coins per view (40-20-10-10-20 Rule Ledger simulation)
      coins += 10;
      const rupees = (coins / 100).toFixed(2);
      document.getElementById('userBalance').innerText = `🪙 ${coins} Coins (₹${rupees})`;

      // Show Popup
      const popup = document.getElementById('rewardPopup');
      popup.classList.add('show');
      setTimeout(() => popup.classList.remove('show'), 1200);
    }

    // Touch Swipe Gesture for Next Reel
    let startY = 0;
    document.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, false);
    document.addEventListener('touchend', e => {
      let endY = e.changedTouches[0].clientY;
      if (startY - endY > 50) nextReel();
    }, false);

    // Initial Load
    loadReel(0);
  </script>
</body>
</html>
