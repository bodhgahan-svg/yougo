<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOUGO - Watch & Earn</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    /* Header Bar */
    header { width: 100%; max-width: 480px; background: #1f1f1f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 10; }
    .logo { color: #ff0050; font-size: 22px; font-weight: bold; }
    .coin-badge { background: #ffe600; color: #000; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 5px; }

    /* Container */
    .container { width: 100%; max-width: 480px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: #1f1f1f; padding: 20px; border-radius: 12px; }

    /* Auth Forms */
    input { width: 100%; padding: 12px; margin: 8px 0 16px; background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 15px; }
    button { width: 100%; padding: 14px; background: #ff0050; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:disabled { background: #555; }
    .toggle-link { color: #aaa; text-align: center; margin-top: 12px; font-size: 14px; cursor: pointer; text-decoration: underline; }

    /* Video Player Section */
    .video-card { display: flex; flex-direction: column; gap: 12px; }
    iframe { width: 100%; height: 240px; border-radius: 8px; border: none; }
    .timer-text { color: #00ff66; font-size: 14px; text-align: center; font-weight: bold; }
    
    .hidden { display: none; }
    .msg { margin-top: 10px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <div class="logo">YOUGO</div>
    <div id="coinBadge" class="coin-badge hidden">🪙 <span id="userCoins">0</span> Coins</div>
  </header>

  <div class="container">
    
    <!-- Auth Section -->
    <div id="authSection" class="card">
      <h2 id="authTitle" style="margin-bottom: 15px; text-align: center;">साइन अप करें</h2>
      <input type="email" id="email" placeholder="ईमेल (Email)" />
      <input type="password" id="password" placeholder="पासवर्ड (Password)" />
      <button id="authBtn" onclick="handleAuth()">साइन अप करें (Sign Up)</button>
      <div class="toggle-link" onclick="toggleAuthMode()" id="toggleBtn">पहले से अकाउंट है? लॉगिन करें</div>
      <div id="authMsg" class="msg"></div>
    </div>

    <!-- Main Dashboard / Video Feed Section -->
    <div id="dashboardSection" class="card hidden">
      <h3 style="margin-bottom: 10px;">🎥 वीडियो देखें और कॉइन्स कमाएं</h3>
      <div class="video-card">
        <iframe id="videoPlayer" src="https://www.youtube.com/embed/dQw4w9WgXcQ?enablejsapi=1" allowfullscreen></iframe>
        <div id="timerText" class="timer-text">वीडियो चलाएं और 30 सेकंड देखें...</div>
        <button id="claimBtn" onclick="claimReward()" disabled>पुरस्कार का दावा करें (+10 Coins)</button>
      </div>
      <button onclick="logout()" style="background: #333; margin-top: 20px;">लॉग आउट करें</button>
    </div>

  </div>

  <script>
    let isLogin = false;
    let coins = 0;
    let watchTimer = null;
    let secondsWatched = 0;

    function toggleAuthMode() {
      isLogin = !isLogin;
      document.getElementById('authTitle').innerText = isLogin ? 'लॉगिन करें' : 'साइन अप करें';
      document.getElementById('authBtn').innerText = isLogin ? 'लॉगिन (Login)' : 'साइन अप करें (Sign Up)';
      document.getElementById('toggleBtn').innerText = isLogin ? 'अकाउंट नहीं है? साइन अप करें' : 'पहले से अकाउंट है? लॉगिन करें';
    }

    async function handleAuth() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('authMsg');
      
      // मोबाइल से फिक्स: साइन-अप और लॉगिन के एंडपॉइंट्स अब server.js से मैच हैं
      const endpoint = isLogin ? '/api/login' : '/api/auth/signup';

      msg.innerText = 'कृपया प्रतीक्षा करें...';
      msg.style.color = '#ccc';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          msg.style.color = '#00ff66';
          msg.innerText = isLogin ? 'लॉगिन सफल!' : 'अकाउंट बन गया! अब लॉगिन करें।';
          if (isLogin) {
            showDashboard();
          } else {
            toggleAuthMode();
          }
        } else {
          msg.style.color = '#ff4444';
          msg.innerText = data.error || 'कुछ गड़बड़ हुई';
        }
      } catch (err) {
        msg.style.color = '#ff4444';
        msg.innerText = 'सर्वर कनेक्शन एरर';
      }
    }

    function showDashboard() {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('coinBadge').classList.remove('hidden');
      startVideoTracking();
    }

    function startVideoTracking() {
      secondsWatched = 0;
      document.getElementById('claimBtn').disabled = true;
      document.getElementById('timerText').innerText = 'वीडियो देखकर 30 सेकंड प्रतीक्षा करें...';
      
      clearInterval(watchTimer);
      watchTimer = setInterval(() => {
        secondsWatched++;
        document.getElementById('timerText').innerText = `प्रतीक्षा करें: ${30 - secondsWatched} सेकंड`;
        if (secondsWatched >= 30) {
          clearInterval(watchTimer);
          document.getElementById('timerText').innerText = '🎉 आप 10 कॉइन्स क्लेम कर सकते हैं!';
          document.getElementById('claimBtn').disabled = false;
        }
      }, 1000);
    }

    function claimReward() {
      coins += 10;
      document.getElementById('userCoins').innerText = coins;
      alert('बधाई हो! आपको 10 Coins मिल गए हैं।');
      startVideoTracking();
    }

    function logout() {
      clearInterval(watchTimer);
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('coinBadge').classList.add('hidden');
    }
  </script>
</body>
</html>
