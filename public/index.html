<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YOUGO - Endless Reels</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #000; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
    
    /* Sticky Top Header */
    header { position: fixed; top: 0; width: 100%; z-index: 50; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%); }
    .logo { color: #ff0050; font-size: 22px; font-weight: bold; }
    .coin-badge { background: #ffe600; color: #000; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; }

    /* Swipe Container */
    .reels-wrapper { width: 100%; height: 100vh; display: flex; flex-direction: column; position: relative; }
    .reel-card { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; }
    
    iframe { width: 100%; height: 100%; border: none; }

    /* Overlay Controls & Bottom Bar */
    .overlay { position: absolute; bottom: 20px; left: 0; width: 100%; padding: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 40; background: linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%); }
    .timer-text { color: #00ff66; font-size: 14px; text-align: center; font-weight: bold; }
    .claim-btn { width: 100%; padding: 14px; background: #ff0050; border: none; border-radius: 25px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    .claim-btn:disabled { background: #444; opacity: 0.6; }

    /* Auth Modal */
    .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 100; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background: #1f1f1f; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; }
    input { width: 100%; padding: 12px; margin: 8px 0 16px; background: #2b2b2b; border: 1px solid #444; border-radius: 8px; color: #fff; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="logo">YOUGO</div>
    <div id="coinBadge" class="coin-badge hidden">🪙 <span id="userCoins">0</span></div>
  </header>

  <!-- Login Modal -->
  <div id="authOverlay" class="auth-overlay">
    <div class="card">
      <h2 id="authTitle" style="margin-bottom: 15px; text-align: center;">लॉगिन करें</h2>
      <input type="email" id="email" placeholder="ईमेल (Email)" />
      <input type="password" id="password" placeholder="पासवर्ड (Password)" />
      <button onclick="handleAuth()" style="width:100%; padding:14px; background:#ff0050; border:none; border-radius:8px; color:#fff; font-weight:bold;">लॉगिन</button>
      <div style="color:#aaa; text-align:center; margin-top:12px; cursor:pointer;" onclick="toggleAuthMode()" id="toggleBtn">अकाउंट नहीं है? साइन अप करें</div>
      <div id="authMsg" style="margin-top:10px; font-size:13px; text-align:center;"></div>
    </div>
  </div>

  <!-- Swipable Feed -->
  <div id="feedContainer" class="reels-wrapper hidden">
    <div class="reel-card">
      <iframe id="videoPlayer" src="" allow="autoplay" allowfullscreen></iframe>
      <div class="overlay">
        <div id="timerText" class="timer-text">स्वाइप करें या 15 सेकंड देखें...</div>
        <button id="claimBtn" class="claim-btn" onclick="claimReward()" disabled>पुरस्कार लें (+10 Coins)</button>
      </div>
    </div>
  </div>

  <script>
    let isLogin = true;
    let coins = 0;
    let watchTimer = null;
    let secondsWatched = 0;
    let currentUserId = null;

    // ट्रेंडिंग वर्टिकल Shorts लिंक्स
    const shortVideos = [
      "https://www.youtube.com/embed/tgbNymZ7vqY?autoplay=1&controls=0&loop=1",
      "https://www.youtube.com/embed/L_LUpnjgPso?autoplay=1&controls=0&loop=1",
      "https://www.youtube.com/embed/3JZ_D3ELwOQ?autoplay=1&controls=0&loop=1"
    ];
    let currentIndex = 0;

    // Touch Swipe Detection
    let touchStartY = 0;
    let touchEndY = 0;

    document.addEventListener('touchstart', e => { touchStartY = e.changedTouches[0].screenY; });
    document.addEventListener('touchend', e => {
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    });

    function handleSwipe() {
      if (touchStartY - touchEndY > 50) {
        // Swipe Up (Next Video)
        nextReel();
      } else if (touchEndY - touchStartY > 50) {
        // Swipe Down (Previous Video)
        prevReel();
      }
    }

    function toggleAuthMode() {
      isLogin = !isLogin;
      document.getElementById('authTitle').innerText = isLogin ? 'लॉगिन करें' : 'साइन अप करें';
      document.getElementById('toggleBtn').innerText = isLogin ? 'अकाउंट नहीं है? साइन अप करें' : 'पहले से अकाउंट है? लॉगिन करें';
    }

    async function handleAuth() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('authMsg');
      const endpoint = isLogin ? '/api/login' : '/api/auth/signup';

      msg.innerText = 'प्रतीक्षा करें...';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          if (isLogin) {
            currentUserId = data.user.id;
            document.getElementById('authOverlay').classList.add('hidden');
            document.getElementById('feedContainer').classList.remove('hidden');
            document.getElementById('coinBadge').classList.remove('hidden');
            loadVideo(0);
          } else {
            msg.innerText = 'अकाउंट बन गया! लॉगिन करें।';
            toggleAuthMode();
          }
        } else {
          msg.innerText = data.error || 'एरर आया';
        }
      } catch (err) {
        msg.innerText = 'सर्वर कनेक्शन एरर';
      }
    }

    function loadVideo(index) {
      currentIndex = index;
      document.getElementById('videoPlayer').src = shortVideos[currentIndex];
      startVideoTracking();
    }

    function nextReel() {
      currentIndex = (currentIndex + 1) % shortVideos.length;
      loadVideo(currentIndex);
    }

    function prevReel() {
      currentIndex = (currentIndex - 1 + shortVideos.length) % shortVideos.length;
      loadVideo(currentIndex);
    }

    function startVideoTracking() {
      secondsWatched = 0;
      document.getElementById('claimBtn').disabled = true;
      clearInterval(watchTimer);

      watchTimer = setInterval(() => {
        secondsWatched++;
        document.getElementById('timerText').innerText = `प्रतीक्षा करें: ${15 - secondsWatched} सेकंड`;
        if (secondsWatched >= 15) {
          clearInterval(watchTimer);
          document.getElementById('timerText').innerText = '🎉 स्वाइप करने से पहले 10 Coins लें!';
          document.getElementById('claimBtn').disabled = false;
        }
      }, 1000);
    }

    async function claimReward() {
      try {
        const res = await fetch('/api/user/add-coins', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUserId, coinsToAdd: 10 })
        });
        const data = await res.json();
        if (res.ok) {
          coins = data.totalCoins;
          document.getElementById('userCoins').innerText = coins;
          nextReel();
        }
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
